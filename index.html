<!DOCTYPE html>
<html lang="en" data-theme="calces-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scientific Calculator Plus 991</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalcES 991">
  <meta name="theme-color" content="#121415">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="calculator-app">
    <!-- Top System Spacer for iPhone Safe Area / Dynamic Island -->
    <div class="safe-area-spacer"></div>

    <!-- CalcES Header / Brand Switcher Bar -->
    <header class="app-header">
      <div class="brand-toggle-group">
        <button id="theme-calces-btn" class="theme-tab-btn active">CalcES 991</button>
        <button id="theme-casio-btn" class="theme-tab-btn">Casio 991ES</button>
      </div>
      <div class="header-right-tools">
        <button id="quick-hist-btn" class="header-btn" title="History">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button id="quick-vars-btn" class="header-btn" title="Variables">
          <span style="font-weight: 800; font-size: 13px;">[x]</span>
        </button>
      </div>
    </header>

    <!-- Calculator Body / Chassis -->
    <main class="calculator-chassis">
      <!-- Casio Physical Top Header (visible in Casio Classic skin) -->
      <div class="casio-header">
        <div class="casio-branding">
          <span class="casio-logo">CASIO</span>
          <span class="casio-model">fx-991ES PLUS</span>
          <span class="casio-vpam">NATURAL-V.P.A.M.</span>
        </div>
        <div class="solar-panel-housing">
          <div class="solar-cell"></div>
          <span class="two-way-power">TWO WAY POWER</span>
        </div>
      </div>

      <!-- LCD Display Bezel & Screen -->
      <section class="lcd-bezel">
        <div class="lcd-screen">
          <div class="lcd-header-line">
            <span class="calces-mode-indicators">SCI &nbsp; MATH &nbsp; DECI</span>
            <div id="lcd-status" class="lcd-status"></div>
          </div>
          <div id="lcd-expression" class="lcd-expression">
            <span class="cursor"></span>
          </div>
          <div id="lcd-result" class="lcd-result"></div>
        </div>
      </section>

      <!-- CalcES Icon Toolbar (Green Menu, Sigma, Settings, Zoom -, Zoom +, DEG) -->
      <nav class="calces-icon-toolbar">
        <button id="tb-menu-btn" class="tb-btn" title="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button id="tb-sigma-btn" class="tb-btn" title="Formulas">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 8h8l-5 4 5 4H8"/></svg>
        </button>
        <button id="tb-settings-btn" class="tb-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="tb-zoomout-btn" class="tb-btn" title="Zoom Out">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <button id="tb-zoomin-btn" class="tb-btn" title="Zoom In">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <button id="quick-deg-btn" class="angle-pill-btn">DEG</button>
      </nav>

      <!-- Upper Keypad: Scientific & Function Keys (6 Columns) -->
      <section id="func-keypad" class="keypad-grid-func"></section>

      <!-- Lower Keypad: Numpad & Arithmetic Keys (5 Columns) -->
      <section id="numpad-keypad" class="keypad-grid-numpad"></section>
    </main>

    <!-- 2D Function Grapher Modal -->
    <div id="graph-panel" class="overlay-panel hidden">
      <div class="panel-header">
        <h3>2D Function Grapher (y = f(x))</h3>
        <div class="panel-actions">
          <button id="graph-reset-btn" class="btn-sm">Reset View</button>
          <button id="graph-close-btn" class="btn-sm close-btn">✕</button>
        </div>
      </div>
      <div class="graph-input-row">
        <span>f(x) = </span>
        <input type="text" id="graph-expr-input" value="sin(x)" placeholder="e.g. sin(x), x^2 - 4">
        <button id="graph-plot-btn" class="btn-sm">Plot</button>
      </div>
      <div class="graph-canvas-container">
        <canvas id="graph-canvas"></canvas>
      </div>
    </div>

    <!-- Mode Selector Modal -->
    <div id="mode-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Select Calculation Mode</h3>
          <button class="close-btn">✕</button>
        </div>
        <div class="mode-list"></div>
      </div>
    </div>

    <!-- Variables Modal -->
    <div id="var-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Variables Manager</h3>
          <button class="close-btn">✕</button>
        </div>
        <div class="vars-grid"></div>
        <div class="modal-footer">
          <button class="btn-sm btn-clear-all">Clear All Variables (CLRv)</button>
        </div>
      </div>
    </div>

    <!-- Constants Modal -->
    <div id="constants-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Scientific Constants (01–40)</h3>
          <button class="close-btn">✕</button>
        </div>
        <input type="text" class="const-search" placeholder="Search constant name or symbol...">
        <div class="constants-list custom-scroll"></div>
      </div>
    </div>

    <!-- Conversions Modal -->
    <div id="conversions-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Metric Conversions (01–40)</h3>
          <button class="close-btn">✕</button>
        </div>
        <input type="text" class="conv-search" placeholder="Search conversion...">
        <div class="conversions-list custom-scroll"></div>
      </div>
    </div>

    <!-- History Drawer -->
    <div id="history-drawer" class="drawer-overlay hidden">
      <div class="drawer-content">
        <div class="drawer-header">
          <h3>Calculation History</h3>
          <button class="close-btn">✕</button>
        </div>
        <div class="history-list custom-scroll"></div>
        <div class="drawer-footer">
          <button class="btn-sm btn-clear-hist">Clear History</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Calculator Settings</h3>
          <button class="close-btn">✕</button>
        </div>
        <div class="settings-content">
          <div class="setting-row">
            <label for="setting-theme">UI Theme / Skin</label>
            <select id="setting-theme">
              <option value="calces-dark">Modern CalcES Dark (OLED)</option>
              <option value="casio-classic">Classic Casio fx-991ES PLUS</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="setting-angle">Angle Unit</label>
            <select id="setting-angle">
              <option value="DEG">Degree (DEG)</option>
              <option value="RAD">Radian (RAD)</option>
              <option value="GRA">Gradian (GRA)</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="setting-sound">Key Click Sound</label>
            <input type="checkbox" id="setting-sound" checked>
          </div>
          <div class="setting-row">
            <label for="setting-haptics">Vibration / Haptics</label>
            <input type="checkbox" id="setting-haptics" checked>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
